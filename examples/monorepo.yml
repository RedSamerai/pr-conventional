# 多包 monorepo（v0.1.0 用法）
# 单一根配置 + scopeRegex 约束各模块边界；运行时对 push 区间全部 commit 生效。
#
# 注意（v0.1.0 现状）：per-package 规则路由（monorepo.packages[]，按变更文件归属选规则集）
# 计划在 v0.2.0 提供，当前版本运行时不读取该字段。v0.1.0 下如需"各模块不同规则"，
# 请用多份 config 文件 + 多个 action 调用（每个 config-path 指向一份），或用 scopeRegex
# 在单一配置内约束允许的 scope 集合。
fixMode: false
rules:
  commit-message:
    enabled: true
    types: [feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert]
    subjectMaxLength: 72
    # 示例：约束所有 commit 的 scope 落在已知模块白名单内（monorepo 常用）
    # scopeRegex: '^(frontend|backend|shared|infra)[a-z0-9-]*$'
  pr-title:
    enabled: true
    maxLength: 100
    pattern: '^(feat|fix|docs|chore|refactor)\([^)]+\): .+'
  pr-body:
    enabled: true
    requiredSections: [变更说明, 测试方案]
