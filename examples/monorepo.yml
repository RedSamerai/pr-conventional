# 多包 monorepo：按 commit 改动文件自动路由到各 package 的规则集（v0.2.0 已实现）
# 运行时：每个 commit 按它改动的文件归属到 path 前缀，用「根配置 + 该 package.rules」deepMerge 校验；
# 一个 commit 触及多个 package → 各 package 规则集各校验一次（最严语义）；
# 只改根目录/公共文件 / merge commit / 浅克隆读不到改动文件 → 回退根配置。
# PR 标题/正文不路由（整 PR 级别），走根配置（v0.3 再做 PR 路由）。
#
# 注意：packages[].rules 是 RuleConfig 本身（直接挂 types/scopeRegex/enabled 等字段），
# 不要再套一层 "commit-message"。未写的字段继承根 commit-message 规则（deepMerge）。
fixMode: false
rules:
  commit-message:
    enabled: true
    types: [feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert]
    subjectMaxLength: 72
  pr-title:
    enabled: true
    maxLength: 100
    pattern: '^(feat|fix|docs|chore|refactor)\([^)]+\): .+'
  pr-body:
    enabled: true
    requiredSections: [变更说明, 测试方案]
monorepo:
  enabled: true
  packages:
    - path: "packages/frontend"
      rules:
        types: [feat, fix, docs, style, chore, test]
        scopeRegex: '^frontend[a-z0-9-]*$'
    - path: "packages/backend"
      rules:
        types: [feat, fix, docs, chore, test, perf]
        scopeRegex: '^api[a-z0-9-]*$'
