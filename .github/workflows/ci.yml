name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify dist/ is up-to-date
        run: |
          npm run build
          if ! git diff --exit-code --quiet dist/; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the output before merging."
            exit 1
          fi


  self-check:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - name: Run action against real PR (or sample for push)
        run: node dist/index.js
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name == 'pull_request' && 'pull_request' || 'push' }}
          # 事件文件：PR 事件用平台注入的真实 payload；push 事件回退到仓库内静态样例
          GITHUB_EVENT_PATH: ${{ github.event_name == 'pull_request' && github.event_path || './.ci-event.json' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        if: success()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: pr-conventional.sarif
