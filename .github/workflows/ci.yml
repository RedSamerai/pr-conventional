name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build


  self-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - name: Run action against real PR (or sample for push)
        run: node dist/index.js
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name == 'pull_request' && 'pull_request' || 'push' }}
          # push 事件下此值为无效占位（src 的 push 分支读 .git/logs/HEAD，不读事件文件）；
          # 仅 PR 事件真实使用。将来若要让 push 也校验样例 PR，再在 src/index.ts 加 fallback 逻辑。
          GITHUB_EVENT_PATH: ${{ github.event_name == 'pull_request' && github.event_path || './.ci-event.json' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
