name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build


  self-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - name: Run action against real PR (or sample for push)
        run: node dist/index.js
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name == 'pull_request' && 'pull_request' || 'push' }}
          GITHUB_EVENT_PATH: ${{ github.event_name == 'pull_request' && github.event_path || './.ci-event.json' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
