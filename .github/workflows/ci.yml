name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build


  self-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - name: Run action against own PR
        run: node dist/index.js
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: ./.ci-event.json
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create dummy PR event if missing
        if: failure()
        run: |
          echo '{"pull_request":{"number":1,"title":"feat(ci): dummy","body":"测试方案：x\n回滚方案：y"}}' > ./.ci-event.json
          node dist/index.js
